<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nextidea Company</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        header {
            padding: 80px 20px;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        p {
            font-size: 22px;
            color: #d1d5db;
        }

        .box {
            margin: 40px auto;
            padding: 30px;
            max-width: 600px;
            border-radius: 20px;
            background: #1f2937;
        }

        .status {
            color: #22c55e;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>

    <h1>Nextidea Company</h1>

    <p>
        Application déployée avec Docker
        et automatisée avec Jenkins.
    </p>

    <div class="box">
        <h2>DevOps CI/CD</h2>

        <p class="status">
            ● Application opérationnelle
        </p>
    </div>

</header>

</body>
</html>
